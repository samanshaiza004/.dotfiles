[config]
version_check = false
fallback_color = "#6e93c4"
prefer = "closest-to-fallback"
caching = true
source_color_index = 0

[config.wallpaper]
set = false
command = "true"

# Home Manager symlinks this config into the Nix store, so template inputs must
# point at their runtime paths rather than resolving relative to that symlink.
[templates.ghostty]
input_path = "/home/saman/.config/matugen/templates/ghostty-colors"
output_path = "~/.config/ghostty/config-colors"

[templates.quickshell]
input_path = "/home/saman/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/generated/MatugenColors.qml"

[templates.palette-json]
input_path = "/home/saman/.config/matugen/templates/palette.json"
output_path = "~/.config/quickshell/generated/palette.json"
